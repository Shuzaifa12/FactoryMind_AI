
[project]
name = "factorymind-ai-backend"
version = "0.1.0"
description = "FactoryMind AI predictive maintenance backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "google-genai>=0.1.0",
]

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*"]
ignore_missing_imports = true
